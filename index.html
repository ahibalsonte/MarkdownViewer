<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  
<style>
  @font-face { font-family:'Pretendard'; src:url('./fonts/PretendardVariable.ttf') format('truetype'); font-weight:100 900; }
  @font-face { font-family:'PretendardJP'; src:url('./fonts/PretendardJPVariable.ttf') format('truetype'); font-weight:100 900; }
  @font-face { font-family: 'Eulyoo1945'; src: url('./fonts/Eulyoo1945-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Eulyoo1945'; src: url('./fonts/Eulyoo1945-SemiBold.ttf') format('truetype'); font-weight: 600; }
  @font-face { font-family: 'NotoSans-Italic'; src: url('./fonts/NotoSans-Italic-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSans'; src: url('./fonts/NotoSans-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSansKR'; src: url('./fonts/NotoSansKR-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSansJP'; src: url('./fonts/NotoSansJP-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSansSC'; src: url('./fonts/NotoSansSC-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSansTC'; src: url('./fonts/NotoSansTC-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerif'; src: url('./fonts/NotoSerif-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerif-Italic'; src: url('./fonts/NotoSerif-Italic-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerifJP'; src: url('./fonts/NotoSerifJP-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerifKR'; src: url('./fonts/NotoSerifKR-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerifSC'; src: url('./fonts/NotoSerifSC-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'NotoSerifTC'; src: url('./fonts/NotoSerifTC-VariableFont_wdth,wght.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family:'D2Coding'; src:url('./font/D2Coding.ttf') format('truetype'); font-weight:normal; }
  
  :root {
    --black: #322823;
    --grey: #ccc;
    --bg: #F1EFE5;
    --tab-bg: #E4E1D4;
    --tab-active: #F1EFE5;
    --tab-border: #c8c4b4;
  }
  
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Pretendard', 'PretendardJP', 'NotoSans', sans-serif;
    background: var(--bg);
    color: var(--black);
    transition: font-family 0.2s ease;
  }

  /* ── 헤더 ── */
  #header {
    padding: 20px 20px 0;
    line-height: 1.3;
  }

  #header h2, #header p {
    margin: 10px 0;
  }

  #drop-zone {
    margin-top: 14px;
    border: 2px dashed var(--tab-border);
    border-radius: 8px;
    padding: 16px 20px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }

  #drop-zone:hover,
  #drop-zone.drag-over {
    background: #f0f0f0;
    border-color: var(--black);
  }

  #drop-label {
    font-size: 14px;
    color: #666;
    pointer-events: none;
  }

  #drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .font-selector-container {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .font-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--black);
    background-color: #fff;
    color: var(--black);
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s ease;
    height: 30px;
  }

  .font-btn.active {
    background-color: var(--black);
    color: var(--bg);
  }

  .font-preview-char {
    font-size: 18px;
    font-weight: bold;
    border-right: 1px solid rgba(0,0,0,0.1);
    padding-right: 6px;
  }

  .font-btn.active .font-preview-char {
    border-right: 1px solid rgba(255,255,255,0.3);
  }

  #font-warning {
    color: #bd3a3a;
    font-size: 13px;
    font-weight: 500;
    display: none;
  }

  .copy-md-container {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  #copy-md-feedback {
    font-size: 13px;
    color: green;
    display: none;
  }

  /* ── 편집기 ── */
  #editor-area {
    display: none;
    padding: 20px;
  }

  #editor-area.visible {
    display: block;
  }

  #md-editor {
    width: 100%;
    min-height: 60vh;
    padding: 16px;
    font-family: 'D2Coding', monospace;
    font-size: 14px;
    line-height: 1.7;
    background: #fff;
    color: var(--black);
    border: 1.5px solid var(--tab-border);
    border-radius: 8px;
    resize: vertical;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
  }

  #md-editor:focus {
    border-color: var(--black);
  }

  .editor-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .editor-toolbar .font-btn {
    font-size: 13px;
    height: 28px;
    padding: 4px 10px;
  }

  #save-feedback {
    font-size: 13px;
    color: green;
    display: none;
  }

  /* 탭에 수정 표시 점 */
  .tab.dirty .tab-name::after {
    content: ' ●';
    font-size: 9px;
    color: #bd3a3a;
    vertical-align: middle;
  }

  /* ── 탭 영역 ── */
  #tab-bar-wrapper {
    margin-top: 18px;
    border-bottom: 2px solid var(--tab-border);
    display: flex;
    align-items: flex-end;
    gap: 0;
    overflow-x: auto;
    overflow-y: hidden;
    height: fit-content;
    scrollbar-width: thin;
    scrollbar-color: var(--tab-border) transparent;
  }

  #tab-bar-wrapper::-webkit-scrollbar {
    height: auto;
  }
  #tab-bar-wrapper::-webkit-scrollbar-thumb {
    background: var(--tab-border);
    border-radius: 2px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 2px solid transparent;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    max-width: 200px;
    background: var(--tab-bg);
    color: #666;
    transition: background 0.15s, color 0.15s;
    position: relative;
    bottom: -2px;
    user-select: none;
  }

  .tab:hover {
    background: #dedad0;
    color: var(--black);
  }

  .tab.active {
    background: var(--tab-active);
    color: var(--black);
    border-color: var(--tab-border);
    font-weight: 600;
  }

  .tab-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
  }

  .tab-close {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #999;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s, color 0.15s;
  }

  .tab-close:hover {
    background: rgba(0,0,0,0.12);
    color: var(--black);
  }

  /* 탭이 없을 때 안내 */
  #tab-empty-hint {
    padding: 6px 0 10px;
    font-size: 13px;
    color: #999;
    display: none;
  }

  /* ── 뷰어 ── */
  #viewer {
    padding: 20px;
    display: none;
    line-height: 1.6;
  }

  #viewer.visible {
    display: block;
  }

  #viewer .table-wrap {
    overflow-x: auto;
    max-width: 100%;
    margin: 1em 0;
  }

  #viewer table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
  }

  #viewer th, #viewer td {
    border: 1px solid var(--black);
    padding: 10px;
    text-align: left;
  }

  #viewer blockquote {
    padding: 1px 20px;
    margin: 20px 0;
    border-radius: 5px;
    position: relative;
  }

  #viewer blockquote::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--grey);
    border-radius: 999px;
  }

  #viewer ul, #viewer ol {
    padding: 7px 20px;
  }

  #viewer img {
    border-radius: 10px;
    width: 100%;
    margin: 10px 0;
  }

  #viewer pre {
    width: 100%;
    box-sizing: border-box;
    font-family: 'D2Coding';
    padding: 0;
    border-radius: 0 0 0 8px;
  }

  #viewer pre code.hljs {
    border-radius: 0 0 0 8px;
  }

  .code-block {
    margin: 1em 0;
    overflow: hidden;
    border-radius: 8px;
  }

  .code-block pre { margin: 0; }

  .code-header {
    height: 40px;
    padding: 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e1e1e;
    color: var(--grey);
    font-size: 14px;
  }

  .copy-btn {
    border: none;
    background: transparent;
    color: #ccc;
    cursor: pointer;
  }

  .copy-btn:hover { color: white; }

  /* ── 푸터 ── */
  #footer {
    padding: 20px;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="header">
  <h2>마크다운 뷰어</h2>
  <p>markdown/txt 파일을 올리면 바로 보여줍니다. 여러 파일을 한꺼번에 선택할 수 있습니다.</p>

  <div style="display:flex; gap:10px; align-items:stretch; margin-top:14px;">
    <div id="drop-zone" style="margin-top:0; flex:1;">
      <span id="drop-label">📂 파일을 여기에 드래그하거나 클릭해서 선택</span>
      <input type="file" id="fileInput" accept=".md,.txt" multiple>
    </div>
    <button id="new-doc-btn" class="font-btn" style="white-space:nowrap; height:auto;">
      ✏️ 새 문서 작성
    </button>
  </div>

  <div class="font-selector-container">
    <button class="font-btn active" data-family="'Pretendard', 'PretendardJP'">
      <span class="font-preview-char" style="font-family:'Pretendard';">가</span>
      <span>Pretendard</span>
    </button>
    <button class="font-btn" data-family="'NotoSans','NotoSansTC','NotoSansKR','NotoSansJP','NotoSansSC'">
      <span class="font-preview-char" style="font-family:'NotoSans';">가</span>
      <span>Noto Sans</span>
    </button>
    <button class="font-btn" data-family="'NotoSerif','NotoSerifKR'">
      <span class="font-preview-char" style="font-family:'NotoSerifKR','NotoSerifJP','NotoSerifSC','NotoSerifTC'">가</span>
      <span style="font-family:'NotoSerifKR'">Noto Serif</span>
    </button>
    <button class="font-btn" data-family="'Eulyoo1945'" data-warning="true">
      <span class="font-preview-char" style="font-family:'Eulyoo1945';">가</span>
      <span style="font-family:'Eulyoo1945'">을유1945</span>
    </button>
    <button class="font-btn" data-family="system-ui">
      <span class="font-preview-char" style="font-family:system-ui;">가</span>
      <span style="font-family:system-ui">시스템 기본</span>
    </button>
    <span id="font-warning">⚠️ 해당 폰트는 일부 글자에서 깨짐 현상이 있을 수 있습니다.</span>
  </div>

  <div class="copy-md-container">
    <button id="copy-md-btn" class="font-btn" style="margin-top:5px;">
      📋 본문 마크다운 복사
    </button>
    <button id="edit-mode-btn" class="font-btn" style="margin-top:5px;">
      ✏️ 편집 모드
    </button>
    <button id="save-md-btn" class="font-btn" style="margin-top:5px;">
      💾 .md 저장
    </button>
    <button id="save-txt-btn" class="font-btn" style="margin-top:5px;">
      💾 .txt 저장
    </button>
    <span id="copy-md-feedback">✔ 복사됐습니다!</span>
  </div>

  <!-- 탭 바 -->
  <div id="tab-bar-wrapper">
    <!-- 탭 없을 때 안내 문구 -->
    <span id="tab-empty-hint">파일을 불러오면 여기에 탭이 생깁니다.</span>
  </div>
</div>

<!-- 편집기 영역 -->
<div id="editor-area">
  <div class="editor-toolbar">
    <button id="editor-preview-btn" class="font-btn">👁 미리보기로 전환</button>
    <span id="save-feedback">✔ 저장됐습니다!</span>
  </div>
  <textarea id="md-editor" placeholder="마크다운을 입력하세요..."></textarea>
</div>

<div id="viewer"></div>

<hr>
<div id="footer">
  버그 제보 및 개선 제안, 각종 문의: ashi.bal.son.te@gmail.com
</div>

<script>
// ── 상태 ──────────────────────────────────────────
const tabs = [];          // { id, name, content }
let activeTabId = null;
let tabCounter  = 0;
let isEditMode  = false;
let editorDirty = false; // 현재 탭 미저장 변경 있음

// ── DOM 참조 ──────────────────────────────────────
const fileInput         = document.getElementById("fileInput");
const viewer            = document.getElementById("viewer");
const editorArea        = document.getElementById("editor-area");
const mdEditor          = document.getElementById("md-editor");
const tabBarWrapper     = document.getElementById("tab-bar-wrapper");
const tabEmptyHint      = document.getElementById("tab-empty-hint");
const fontButtons       = document.querySelectorAll(".font-btn");
const fontWarning       = document.getElementById("font-warning");
const copyMdBtn         = document.getElementById("copy-md-btn");
const copyMdFeedback    = document.getElementById("copy-md-feedback");
const editModeBtn       = document.getElementById("edit-mode-btn");
const saveMdBtn         = document.getElementById("save-md-btn");
const saveTxtBtn        = document.getElementById("save-txt-btn");
const editorPreviewBtn  = document.getElementById("editor-preview-btn");
const saveFeedback      = document.getElementById("save-feedback");
const dropZone          = document.getElementById("drop-zone");

marked.setOptions({ breaks: true });

// ── HTML 차단 렌더링 ──────────────────────────────
function renderMarkdown(markdown) {
  const rawHtml = marked.parse(markdown);
  // DOMPurify로 <script>, 인라인 이벤트, <iframe> 등 차단
  const cleanHtml = DOMPurify.sanitize(rawHtml, {
    FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form', 'input'],
    FORBID_ATTR: ['onerror', 'onload', 'onclick', 'onmouseover', 'onfocus',
                  'onblur', 'onchange', 'onsubmit', 'onkeydown', 'onkeyup',
                  'onkeypress', 'style']
  });

  viewer.innerHTML = cleanHtml;
  viewer.classList.add("visible");

  // 테이블 래핑
  viewer.querySelectorAll("table").forEach(table => {
    const wrapper = document.createElement("div");
    wrapper.className = "table-wrap";
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  // 코드블록 처리
  viewer.querySelectorAll("pre code").forEach(code => {
    hljs.highlightElement(code);

    const pre     = code.parentElement;
    const wrapper = document.createElement("div");
    wrapper.className = "code-block";

    const header = document.createElement("div");
    header.className = "code-header";

    const lang =
      [...code.classList].find(c => c.startsWith("language-"))
        ?.replace("language-", "") || "text";

    header.innerHTML = `<span>${lang}</span><button class="copy-btn">Copy</button>`;
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);

    header.querySelector(".copy-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(code.innerText);
    });
  });
}

// ── 편집/미리보기 모드 전환 ───────────────────────
function setEditMode(on) {
  isEditMode = on;
  if (on) {
    const tab = tabs.find(t => t.id === activeTabId);
    mdEditor.value = tab ? tab.content : "";
    editorDirty = false;
    editorArea.classList.add("visible");
    viewer.classList.remove("visible");
    editModeBtn.classList.add("active");
    editModeBtn.textContent = "👁 미리보기 모드";
  } else {
    editorArea.classList.remove("visible");
    editModeBtn.classList.remove("active");
    editModeBtn.textContent = "✏️ 편집 모드";
    // 저장되지 않은 내용이 있으면 탭에 dirty 표시 유지
    const tab = tabs.find(t => t.id === activeTabId);
    if (tab) {
      renderMarkdown(tab.content);
      viewer.classList.add("visible");
    }
  }
}

// 실시간 입력 → dirty 상태 표시
mdEditor.addEventListener("input", () => {
  if (!editorDirty) {
    editorDirty = true;
    // 탭 dirty 표시
    const tabEl = tabBarWrapper.querySelector(`.tab[data-id="${activeTabId}"]`);
    if (tabEl) tabEl.classList.add("dirty");
  }
  // 실시간 미리보기: viewer에 실시간 반영 (편집기 아래 보임 없이 내부 상태만)
  // 원하면 split view로 확장 가능
});

// 미리보기로 전환 (현재 내용 자동 저장 후 전환)
editorPreviewBtn.addEventListener("click", () => {
  applyEditorContent();
});

function applyEditorContent() {
  const content = mdEditor.value;
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;

  tab.content = content;
  saveTabContent(tab);
  localStorage.setItem("markdown", content);
  editorDirty = false;

  const tabEl = tabBarWrapper.querySelector(`.tab[data-id="${activeTabId}"]`);
  if (tabEl) tabEl.classList.remove("dirty");

  setEditMode(false);
}

// 헤더의 편집 모드 버튼
editModeBtn.addEventListener("click", () => {
  if (!activeTabId) return;
  setEditMode(!isEditMode);
});

// ── .md 파일 저장 ──────────────────────────────────
function downloadFile(ext, mimeType) {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  const content  = isEditMode ? mdEditor.value : tab.content;
  const blob     = new Blob([content], { type: mimeType + ";charset=utf-8" });
  const url      = URL.createObjectURL(blob);
  const a        = document.createElement("a");
  a.href         = url;
  const baseName = tab.name.replace(/\.(md|txt)$/i, "");
  a.download     = baseName + ext;
  a.click();
  URL.revokeObjectURL(url);
}

saveMdBtn.addEventListener("click",  () => downloadFile(".md",  "text/markdown"));
saveTxtBtn.addEventListener("click", () => downloadFile(".txt", "text/plain"));

// ── 탭 UI 갱신 ────────────────────────────────────
function renderTabs() {
  tabBarWrapper.querySelectorAll(".tab").forEach(el => el.remove());

  if (tabs.length === 0) {
    tabEmptyHint.style.display = "inline";
    viewer.classList.remove("visible");
    editorArea.classList.remove("visible");
    viewer.innerHTML = "";
    return;
  }

  tabEmptyHint.style.display = "none";

  tabs.forEach(tab => {
    const el = document.createElement("div");
    el.className = "tab" + (tab.id === activeTabId ? " active" : "");
    el.dataset.id = tab.id;

    el.innerHTML = `
      <span class="tab-name" title="${tab.name}">${tab.name}</span>
      <button class="tab-close" title="닫기">✕</button>
    `;

    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("tab-close")) return;
      switchTab(tab.id);
    });

    el.querySelector(".tab-close").addEventListener("click", (e) => {
      e.stopPropagation();
      closeTab(tab.id);
    });

    tabBarWrapper.appendChild(el);
  });
}

// ── 탭 전환 ──────────────────────────────────────
function switchTab(id) {
  // 편집 중이고 미저장 내용 있으면 자동 저장
  if (isEditMode && editorDirty && activeTabId) {
    const prev = tabs.find(t => t.id === activeTabId);
    if (prev) {
      prev.content = mdEditor.value;
      saveTabContent(prev);
    }
  }

  activeTabId = id;
  isEditMode  = false;
  editorDirty = false;
  editorArea.classList.remove("visible");
  editModeBtn.classList.remove("active");
  editModeBtn.textContent = "✏️ 편집 모드";

  renderTabs();

  const tab = tabs.find(t => t.id === id);
  if (tab) {
    renderMarkdown(tab.content);
    localStorage.setItem("markdown", tab.content);
    localStorage.setItem("activeTabId", id);
  }
}

// ── 탭 닫기 ──────────────────────────────────────
function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;

  tabs.splice(idx, 1);
  localStorage.removeItem("tab_" + id);

  if (activeTabId === id) {
    const next = tabs[idx] || tabs[idx - 1];
    activeTabId = next ? next.id : null;
    if (activeTabId) {
      renderTabs();
      switchTab(activeTabId);
      return;
    }
  }

  renderTabs();
  if (!activeTabId) {
    viewer.classList.remove("visible");
    editorArea.classList.remove("visible");
    viewer.innerHTML = "";
  }

  saveTabList();
}

// ── localStorage 저장/복원 ───────────────────────
function saveTabList() {
  localStorage.setItem("tabList", JSON.stringify(
    tabs.map(t => ({ id: t.id, name: t.name }))
  ));
  localStorage.setItem("tabCounter", tabCounter);
}

function saveTabContent(tab) {
  try {
    localStorage.setItem("tab_" + tab.id, tab.content);
  } catch (e) {
    console.warn("localStorage 저장 실패 (용량 초과 가능):", e);
  }
}

function restoreTabs() {
  const listRaw = localStorage.getItem("tabList");
  if (!listRaw) return;

  const list = JSON.parse(listRaw);
  tabCounter = parseInt(localStorage.getItem("tabCounter") || "0", 10);

  list.forEach(meta => {
    const content = localStorage.getItem("tab_" + meta.id);
    if (content !== null) {
      tabs.push({ id: meta.id, name: meta.name, content });
    }
  });

  const savedActive = localStorage.getItem("activeTabId");
  const validActive = tabs.find(t => t.id === savedActive);
  activeTabId = validActive ? savedActive : (tabs[0]?.id ?? null);

  if (activeTabId) {
    renderTabs();
    switchTab(activeTabId);
  } else {
    renderTabs();
  }
}

// ── 파일 입력 ────────────────────────────────────
function loadFiles(files) {
  if (!files.length) return;
  let lastId = null;

  const readNext = (i) => {
    if (i >= files.length) {
      fileInput.value = "";
      saveTabList();
      switchTab(lastId);
      return;
    }
    const file = files[i];
    if (!/\.(md|txt)$/i.test(file.name)) { readNext(i + 1); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const content = e.target.result;
      tabCounter++;
      const id = "tab_" + tabCounter;
      const tab = { id, name: file.name, content };
      tabs.push(tab);
      saveTabContent(tab);
      lastId = id;
      readNext(i + 1);
    };
    reader.readAsText(file);
  };

  readNext(0);
}

fileInput.addEventListener("change", (e) => loadFiles([...e.target.files]));

// 드래그앤드롭
dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("drag-over");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  loadFiles([...e.dataTransfer.files]);
});

// ── 폰트 선택 ────────────────────────────────────
fontButtons.forEach(button => {
  button.addEventListener("click", () => {
    // font-btn 중 헤더 버튼만 active 처리 (editor toolbar 버튼 제외)
    document.querySelectorAll(".font-selector-container .font-btn").forEach(btn => btn.classList.remove("active"));
    if (button.closest(".font-selector-container")) {
      button.classList.add("active");
    }
    const family = button.getAttribute("data-family");
    if (family) {
      document.body.style.fontFamily = family;
      fontWarning.style.display =
        button.getAttribute("data-warning") === "true" ? "inline-block" : "none";
    }
  });
});

// ── 마크다운 복사 ─────────────────────────────────
let feedbackTimer = null;
copyMdBtn.addEventListener("click", () => {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  const content = isEditMode ? mdEditor.value : tab.content;
  navigator.clipboard.writeText(content).then(() => {
    copyMdFeedback.style.display = "inline";
    if (feedbackTimer) clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
      copyMdFeedback.style.display = "none";
    }, 2000);
  });
});

// ── 초기화 ───────────────────────────────────────
restoreTabs();
if (tabs.length === 0) tabEmptyHint.style.display = "inline";

// ── 새 문서 작성 ──────────────────────────────────
const newDocBtn = document.getElementById("new-doc-btn");
newDocBtn.addEventListener("click", () => {
  tabCounter++;
  const id  = "tab_" + tabCounter;
  const tab = { id, name: `새 문서 ${tabCounter}.md`, content: "" };
  tabs.push(tab);
  saveTabContent(tab);
  saveTabList();
  activeTabId = id;
  renderTabs();
  setEditMode(true);
});
</script>
</body>
